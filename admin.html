<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Rifando Ando</title><style>body{margin:0;background:#080808;color:#fff;font-family:system-ui;padding:22px}.wrap{max-width:1100px;margin:auto}.gold{color:#d9a936}.box,.card{background:#151515;border:1px solid #303030;border-radius:18px;padding:18px}.login{max-width:420px;margin:12vh auto}.field{margin:12px 0}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #363636;background:#0d0d0d;color:#fff;font-size:16px;box-sizing:border-box}.btn{background:#d9a936;color:#111;border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.secondary{background:#292929;color:#fff}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.num{font-size:32px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.ticket{padding:8px 3px;border-radius:8px;border:1px solid #333;text-align:center}.apartado{background:#4b3b16}.vendido{background:#333;text-decoration:line-through;color:#888}.row{border-bottom:1px solid #292929;padding:12px 0}.error{color:#ff9999}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(5,1fr)}}</style></head><body><div id="login" class="box login"><h1>🔐 Rifando <span class="gold">Ando</span></h1><h2>Acceso de administrador</h2><div class="field"><input id="email" type="email" placeholder="Correo"></div><div class="field"><input id="pass" type="password" placeholder="Contraseña"></div><button class="btn" onclick="entrar()" style="width:100%">Entrar</button><p id="msg"></p></div><div id="app" class="wrap hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>RIFANDO <span class="gold">ANDO</span> · ADMIN</h1><div><a class="btn secondary" href="index.html">Ver página</a> <button class="btn" onclick="salir()">Salir</button></div></div><p id="status">Cargando...</p><div class="cards"><div class="card">Disponibles<div class="num gold" id="disp">0</div></div><div class="card">Apartados<div class="num" id="apart">0</div></div><div class="card">Vendidos<div class="num" id="vend">0</div></div><div class="card">Participantes<div class="num" id="people">0</div></div></div><div class="box"><h2>Números</h2><p>Los números apartados aparecen en dorado.</p><div class="grid" id="nums"></div></div><div class="box" style="margin-top:18px"><h2>Últimos participantes</h2><div id="participants">Cargando...</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const loginView=document.getElementById('login'),app=document.getElementById('app'),msg=document.getElementById('msg');let rifa=null;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function entrar(){msg.textContent='Entrando...';const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;const r=await db.auth.signInWithPassword({email,password});if(r.error){msg.innerHTML='<span class="error">'+esc(r.error.message)+'</span>';return}await sesion()}async function salir(){await db.auth.signOut();mostrarLogin()}function mostrarLogin(){app.classList.add('hidden');loginView.classList.remove('hidden')}async function sesion(){const {data:{session}}=await db.auth.getSession();if(!session){mostrarLogin();return}loginView.classList.add('hidden');app.classList.remove('hidden');await cargar()}function estado(x){if(x.estado==='vendido')return'vendido';if(x.estado==='apartado'&&x.apartado_hasta&&new Date(x.apartado_hasta)>new Date())return'apartado';return'disponible'}async function cargar(){const {data:r,error}=await db.from('rifas').select('*').eq('estado','activa').limit(1).maybeSingle();if(error||!r){status.textContent='No se pudo cargar la rifa.';return}rifa=r;const {data:n,error:ne}=await db.from('numeros').select('id,numero,estado,apartado_hasta,participante_id').eq('rifa_id',r.id).order('numero');if(ne){status.textContent='No se pudieron cargar los números.';return}disp.textContent=n.filter(x=>estado(x)==='disponible').length;apart.textContent=n.filter(x=>estado(x)==='apartado').length;vend.textContent=n.filter(x=>x.estado==='vendido').length;nums.innerHTML=n.map(x=>'<div class="ticket '+estado(x)+'">'+String(x.numero).padStart(2,'0')+'</div>').join('');const {data:p,error:pe}=await db.from('participantes').select('id,nombre,whatsapp,correo,created_at').order('created_at',{ascending:false}).limit(20);if(pe){participants.textContent='No se pudieron cargar participantes.';return}people.textContent=p?.length||0;participants.innerHTML=p?.length?p.map(x=>{const ns=n.filter(z=>z.participante_id===x.id).map(z=>String(z.numero).padStart(2,'0')).join(', ');return'<div class="row"><b>'+esc(x.nombre)+'</b><br>'+esc(x.whatsapp)+(x.correo?' · '+esc(x.correo):'')+(ns?'<br><span class="gold">Números: '+esc(ns)+'</span>':'')+'<br><small>'+new Date(x.created_at).toLocaleString('es-MX')+'</small></div>'}).join(''):'Sin participantes';status.textContent=r.nombre+' · $'+Number(r.precio_numero).toLocaleString('es-MX')}db.auth.onAuthStateChange((e,s)=>{if(s)sesion();else mostrarLogin()});sesion();setInterval(()=>{if(!app.classList.contains('hidden'))cargar()},10000);</script></body></html>
