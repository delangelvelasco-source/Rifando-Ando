<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#062a1b">
<title>Verificar mis boletos | Sorteo Regular</title>
<meta name="description" content="Consulta tus boletos del Sorteo Regular RA-0002 de Rifando Ando.">
<style>
:root{color-scheme:dark;--bg:#061d15;--panel:#0d3023;--panel2:#143c2c;--lime:#9be653;--muted:#c3d6ca;--line:rgba(155,230,83,.55)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:clamp(18px,4vw,42px) 16px;background:radial-gradient(ellipse at 50% -15%,#1b4932 0%,var(--bg) 58%);color:#f7fbf7;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,620px);margin:clamp(12px,5vh,54px) auto;padding:clamp(22px,5vw,42px);background:linear-gradient(155deg,rgba(18,59,42,.98),rgba(8,39,28,.99));border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 70px #0006, inset 0 1px 0 #ffffff12}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px;font-size:clamp(25px,6vw,34px);font-weight:900;letter-spacing:-1.2px}
.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#9be65318;border:1px solid #9be65355;font-size:23px}
h1{margin:0;font-size:clamp(23px,5vw,30px);text-align:center;letter-spacing:-.6px}
h2{margin:0 0 12px;text-align:center;font-size:15px;font-weight:700;color:var(--lime);letter-spacing:1.4px;text-transform:uppercase}
.intro{text-align:center;margin:0 auto 26px;max-width:460px;color:var(--muted);line-height:1.65;font-size:15px}
.raffle-tag{display:inline-flex;align-items:center;justify-content:center;gap:7px;margin:18px auto 0;padding:9px 14px;border:1px solid #ffffff20;border-radius:999px;background:#ffffff0b;color:#e5f2e8;font-size:13px;font-weight:700}
.raffle-tag:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime)}
form{margin-top:26px}
label{display:block;margin:0 0 9px;font-size:14px;font-weight:800;color:#f2f8f3}
input,button{width:100%;min-height:56px;padding:15px 17px;border-radius:14px;font:inherit;font-size:16px}
input{border:1px solid #ffffff50;background:#f8fbf8;color:#14251b;outline:none;box-shadow:0 2px 0 #0002}
input:focus{border-color:var(--lime);box-shadow:0 0 0 4px #9be65325}
input::placeholder{color:#78867d}
button{margin-top:13px;background:linear-gradient(180deg,#a8ef68,#8bd941);border:0;color:#132411;font-weight:900;letter-spacing:.3px;cursor:pointer;box-shadow:0 7px 18px #0003;transition:transform .15s,filter .15s}
button:active{transform:translateY(1px)}button:disabled{opacity:.65;cursor:wait}
#result{margin-top:26px;line-height:1.55;overflow-wrap:anywhere}
#result:empty{display:none}
#result h3{margin:0 0 8px;font-size:17px;letter-spacing:.3px}
#result p{margin:0 0 14px;color:var(--muted);font-size:14px}
.item{display:flex;align-items:center;gap:10px;padding:14px 15px;margin:9px 0;background:linear-gradient(110deg,#ffffff12,#ffffff08);border:1px solid #ffffff12;border-radius:13px;color:#f0f7f1;font-size:14px}
.item:before{content:"";flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#f4c65e}
.item:has-text(none){}
a{display:inline-flex;margin-top:26px;color:#c8e88b;font-weight:700;text-decoration:none;border-bottom:1px solid #c8e88b80;padding-bottom:3px}
a:hover{color:#fff}
.footer-note{margin:22px 0 0!important;text-align:center;font-size:12px;color:#9bb5a3!important}
@media(max-width:480px){body{padding:14px 12px}main{margin:12px auto;padding:24px 19px;border-radius:22px}.brand{margin-bottom:21px}.intro{font-size:14px}.item{font-size:13px}}
</style>
</head>
<body><main>
<div class="brand"><span class="brand-mark">🎟️</span><span>RIFANDO ANDO</span></div>
<h1>Verificador de boletos</h1>
<div style="text-align:center"><span class="raffle-tag">Sorteo Regular · RA-0002 · Premio $1,000 MXN</span></div>
<p class="intro">Consulta de forma rápida y segura el estado de tu boleto o todos los boletos asociados al celular que registraste al comprar.</p>
<form id="checker">
<label for="ticket">Número de boleto o celular</label>
<input id="ticket" inputmode="numeric" autocomplete="off" maxlength="15" placeholder="Ej. 05 o tu celular" required>
<button id="check" type="submit">VERIFICAR MIS BOLETOS</button>
</form>
<div id="result" role="status" aria-live="polite"></div>
<a href="/">← Volver a Rifando Ando</a>
<p class="footer-note">Consulta oficial del Sorteo Regular RA-0002</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const URL='https://iaviafijfdqinehcfebr.supabase.co';
const KEY='sb_publishable_OOyCaQno11jdZhXkmZvd3w_Wl6PjmES';
const RIFA='4b23f516-7973-4a04-bff6-9b9b5cb90f4d';
const form=document.getElementById('checker'),input=document.getElementById('ticket'),button=document.getElementById('check'),result=document.getElementById('result');
const fmt=n=>String(n).padStart(2,'0');
function show(t,m){result.textContent='';const h=document.createElement('h3');h.textContent=t;const p=document.createElement('p');p.textContent=m;result.append(h,p)}
form.addEventListener('submit',async e=>{
e.preventDefault();const digits=input.value.replace(/\D/g,'');if(!digits){show('Dato no válido','Escribe tu número de boleto o celular.');return}
button.disabled=true;button.textContent='CONSULTANDO…';show('Consultando…','Buscando en el registro del Sorteo Regular RA-0002.');
try{
const db=window.supabase.createClient(URL,KEY);
if(digits.length>=10){
const {data,error}=await db.rpc('consultar_boletos_por_celular',{p_rifa_id:RIFA,p_celular:digits});if(error)throw error;
if(!data?.length){show('SIN RESULTADOS','No encontramos boletos asociados a ese celular en el Sorteo Regular.');return}
show('TUS BOLETOS','Se encontraron '+data.length+' boletos para este celular.');
data.forEach(row=>{const el=document.createElement('div');el.className='item';const paid=String(row.estado||'').toLowerCase()==='vendido'&&String(row.estado_pago||'').toLowerCase()==='confirmado';el.textContent='Boleto '+fmt(row.numero)+' · '+(paid?'PAGADO / CONFIRMADO':String(row.estado_pago||row.estado||'En revisión').toUpperCase())+(row.nombre?' · '+row.nombre:'');result.append(el)});
return;
}
if(digits.length>2){show('DATO NO VÁLIDO','Ingresa un boleto del 00 al 99 o un celular de 10 a 15 dígitos.');return}
const n=Number(digits);if(n<0||n>99){show('FUERA DE RANGO','Los boletos del Sorteo Regular van del 00 al 99.');return}
const {data,error}=await db.from('numeros').select('numero,estado,apartado_hasta,pago_id').eq('rifa_id',RIFA).eq('numero',n).maybeSingle();if(error)throw error;if(!data){show('NO ENCONTRADO','No existe ese boleto en el Sorteo Regular.');return}
let status=String(data.estado||'').toLowerCase(),message='Estado: '+status.toUpperCase();
if(status==='disponible')message='Este boleto aparece DISPONIBLE.';
else if(status==='apartado')message='Este boleto aparece APARTADO. Revisa con atención al cliente si ya realizaste el pago.';
else if(status==='vendido'&&data.pago_id){const {data:pay,error:pe}=await db.from('pagos').select('estado').eq('id',data.pago_id).maybeSingle();if(pe)throw pe;message=pay?.estado==='confirmado'?'COMPRA CONFIRMADA · PAGO REGISTRADO.':'PAGO POR CONFIRMAR. Conserva tu comprobante.'}
else if(status==='vendido')message='El sistema registra el boleto como vendido. Conserva tu comprobante para validar el pago.';
show('BOLETO '+fmt(data.numero),message);
}catch(err){show('NO SE PUDO CONSULTAR',String(err?.message||err))}finally{button.disabled=false;button.textContent='VERIFICAR MIS BOLETOS'}
});
input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,15)});
})();
</script>
</body></html>
