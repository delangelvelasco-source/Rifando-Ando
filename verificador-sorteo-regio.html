h><th>Fecha de pago</th></tr></thead>';const tbodyLive=document.createElement('tbody');rows.forEach(row=>{const state=String(row.estado||'').toLowerCase(),pay=String(row.estado_pago||'').toLowerCase();const full=String(row.nombre||'').trim().split(/\\s+/).filter(Boolean);const first=full.shift()||'—';const last=full.join(' ')||'—';const confirmed=state==='vendido'&&pay==='confirmado';const status=confirmed?'Pagado':state==='apartado'?'Pendiente':state==='vendido'?'En revisión':state?state.charAt(0).toUpperCase()+state.slice(1):'Sin estado';const tr=document.createElement('tr');const vals=[fmt(row.numero),String(row.nombre||'').trim()||'—',status,row.fecha_pago?new Date(row.fecha_pago).toLocaleString('es-MX'):'—'];vals.forEach((value,i)=>{const td=document.createElement('td');td.textContent=value;if(i===0)td.className='num';if(i===2)td.className=confirmed?'live-paid':status==='Pendiente'||status==='En revisión'?'live-pending':'live-other';tr.append(td)});tbodyLive.append(tr)});tableLive.append(tbodyLive);wrap.append(tableLive);result.append(wrap);const list=document.createElement('div');list.className='ticket-list';const foot=document.createElement('p');foot.className='result-foot';foot.textContent='Estados consultados en el registro de Sorteo Regio. Si un pago reciente aún no aparece confirmado, conserva tu comprobante y comunícate con atención al cliente.';result.append(foot);const paid=rows.filter(row=>String(row.estado||'').toLowerCase()==='vendido'&&String(row.estado_pago||'').toLowerCase()==='confirmado');if(paid.length){const printBtn=document.createElement('button');printBtn.type='button';printBtn.className='print-btn';printBtn.innerHTML='⎙ <span>IMPRIMIR COMPROBANTE DE BOLETOS PAGADOS</span>';printBtn.addEventListener('click',()=>{const oldTitle=document.title;document.title='Sorteo Regio - Comprobante de boletos pagados';const printRows=Array.from(list.querySelectorAll('.ticket-row'));const oldDisplays=printRows.map(card=>card.style.display);printRows.forEa
