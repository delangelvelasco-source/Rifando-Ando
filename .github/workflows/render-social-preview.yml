name: Generate social preview PNG
on:
  push:
    branches: [main]
    paths:
      - 'economico-regio-share.svg'
      - '.github/workflows/render-social-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save sharp
      - name: Render PNG
        run: node -e "require('sharp')('economico-regio-share.svg').png().toFile('economico-regio-share.png').then(()=>console.log('PNG listo'))"
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Incorporar cualquier cambio reciente antes de crear el commit del PNG.
          git fetch origin main
          git reset --hard origin/main
          git add economico-regio-share.png
          if git diff --cached --quiet; then echo "No hay cambios"; else git commit -m "Generar PNG para vista previa social"; git push origin HEAD:main; fi
